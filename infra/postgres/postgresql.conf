# Source ledger database configuration (Postgres 16).
# Only settings that matter for CDC / this project are set; everything else is default.

listen_addresses = '*'

# --- Logical replication (CDC) ----------------------------------------------
# 'logical' adds enough info to WAL for pgoutput to decode row-level changes.
wal_level = logical
# One slot for Debezium + headroom for a second consumer (e.g. a re-snapshot test).
max_replication_slots = 4
max_wal_senders = 4

# Safety valve: a stopped connector must never fill the source disk.
# If the slot falls further behind than this, Postgres invalidates the slot
# (pipeline needs a re-snapshot) instead of the OLTP database running out of disk.
# Sized for a laptop; on RDS this would be tens of GB, alerted on well before.
max_slot_wal_keep_size = 1GB

# --- Observability -------------------------------------------------------------
# Commit timestamps make "what committed when" auditable on the source side,
# useful when reconciling against bronze's _source_commit_ts.
track_commit_timestamp = on
log_replication_commands = on
log_min_duration_statement = 1000

# --- Laptop sizing -------------------------------------------------------------
shared_buffers = 128MB
max_connections = 50
