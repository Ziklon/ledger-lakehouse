# Read access to the SOURCE ledger database (Postgres).
# Used for source-to-target reconciliation (Phase 2) and for ad-hoc verification.
connector.name=postgresql
connection-url=jdbc:postgresql://${ENV:PG_HOST}:${ENV:PG_PORT}/${ENV:PG_DATABASE}
# Read-only role (SELECT on schema app only) -- never the table owner.
connection-user=${ENV:PG_READER_USER}
connection-password=${ENV:PG_READER_PASSWORD}
