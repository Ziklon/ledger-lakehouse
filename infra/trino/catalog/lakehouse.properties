# Iceberg lakehouse catalog -- LOCAL overlay (REST catalog + MinIO).
# Phase 3 mounts a different file here (iceberg.catalog.type=glue); Trino rejects
# unused properties, so the catalog *file* is the environment-specific artifact.
# Values still come from the environment -- no secrets in this file.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=${ENV:ICEBERG_REST_URI}
iceberg.rest-catalog.warehouse=${ENV:WAREHOUSE}

iceberg.file-format=PARQUET
iceberg.compression-codec=ZSTD

# Native S3 filesystem (no Hadoop). Endpoint + path-style make it talk to MinIO.
fs.native-s3.enabled=true
s3.endpoint=${ENV:S3_ENDPOINT}
s3.region=${ENV:S3_REGION}
s3.path-style-access=${ENV:S3_PATH_STYLE_ACCESS}
s3.aws-access-key=${ENV:S3_ACCESS_KEY}
s3.aws-secret-key=${ENV:S3_SECRET_KEY}
