[project]
name = "ledger-pipeline"
version = "0.1.0"
description = "Batch control plane for the daily publication: windows, completeness gate, EOD tags, commit"
requires-python = ">=3.12,<3.13"
dependencies = [
    "trino==0.340.0",
    "pyiceberg==0.12.0",
]

[project.scripts]
ledger-pipeline = "ledger_pipeline.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"
